version: '3.8'

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: always
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: Erp@2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/full_schema.sql:/docker-entrypoint-initdb.d/01_full_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ===== Spring Boot 后端 =====
  backend:
    build: ./backend
    container_name: erp-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 覆盖application.yml中的数据源配置(用Docker服务名替换localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/erp_db
      SPRING_DATASOURCE_USERNAME: erp_user
      SPRING_DATASOURCE_PASSWORD: Erp@2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      # 覆盖文件上传和日志路径(Linux路径)
      ERP_UPLOAD_PATH: /app/files
      LOGGING_FILE_NAME: /app/logs/erp.log
    volumes:
      - erp-files:/app/files
      - erp-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # ===== Nginx 前端 =====
  frontend:
    build: ./frontend
    container_name: erp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  erp-files:
  erp-logs:
